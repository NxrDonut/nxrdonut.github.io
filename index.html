<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>nxrdonut</title>

    <meta
        name="description"
        content="Screensharer / Dev / #21 McPvP.com / RLT2"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FULL SCREEN BACKGROUND VIDEO -->
    <video
        id="background-video"
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="video.mp4" type="video/mp4">
    </video>


    <!-- BACKGROUND EFFECTS -->
    <div class="background-gradient"></div>
    <div class="darkness"></div>
    <div class="noise"></div>


    <!-- PARTICLES -->
    <div id="particles"></div>


    <!-- MOUSE EFFECTS -->
    <div class="cursor-glow"></div>

    <div class="cursor-trail trail-1"></div>
    <div class="cursor-trail trail-2"></div>
    <div class="cursor-trail trail-3"></div>
    <div class="cursor-trail trail-4"></div>
    <div class="cursor-trail trail-5"></div>


    <!-- TOP LEFT VOLUME -->
    <div class="volume-control">

        <span class="volume-icon" id="volume-icon">
            🔊
        </span>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.35"
            aria-label="Volume"
        >

    </div>


    <!-- CLICK SCREEN -->
    <div id="intro">

        <div id="enter">
            CLICK ANYWHERE
        </div>

    </div>


    <!-- PROFILE -->
    <main id="profile">

        <div class="card" id="profile-card">

            <!-- PROFILE PICTURE -->
            <div class="avatar-container">

                <img
                    class="avatar"
                    src="pfp.jpg"
                    alt="nxrdonut"
                >

                <div class="avatar-glow"></div>

            </div>


            <!-- USERNAME -->
            <h1 class="username">

                <span>nxrdonut</span>

                <span class="verified">
                    ✓
                </span>

            </h1>


            <p class="handle">
                @nxrdonut
            </p>


            <!-- BADGES -->
            <div class="badges">

                <span class="badge">
                    DEV
                </span>

                <span class="badge">
                    SCREENSHARER
                </span>

                <span class="badge">
                    #21
                </span>

                <span class="badge">
                    RLT2
                </span>

            </div>


            <!-- BIO -->
            <p class="bio">
                Screensharer / Dev / #21 McPvP.com / RLT2
            </p>


            <!-- STATS -->
            <div class="stats">

                <button
                    id="views-button"
                    class="stat"
                    type="button"
                >

                    <span class="stat-icon">
                        ◉
                    </span>

                    <span>
                        <strong id="views">
                            1,284
                        </strong>

                        <small>
                            views
                        </small>
                    </span>

                </button>


                <div class="stat">

                    <span class="stat-icon">
                        ●
                    </span>

                    <span>
                        <strong>
                            online
                        </strong>

                        <small>
                            status
                        </small>
                    </span>

                </div>

            </div>


            <!-- VIEWS POPUP -->
            <div
                id="views-popup"
                class="views-popup"
            >

                <div class="views-popup-inner">

                    <span class="popup-icon">
                        ◉
                    </span>

                    <strong>
                        Profile views
                    </strong>

                    <span id="popup-views">
                        1,284
                    </span>

                </div>

            </div>


            <!-- DIVIDER -->
            <div class="divider"></div>


            <!-- SOCIAL LINKS -->
            <div class="links">

                <!-- DISCORD -->
                <a
                    href="#"
                    id="discord-link"
                >

                    <div class="link-left">

                        <img
                            src="icons/discord.png"
                            alt="Discord"
                        >

                        <span id="discord-text">
                            Discord
                        </span>

                    </div>

                    <span class="arrow">
                        ↗
                    </span>

                </a>


                <!-- YOUTUBE -->
                <a
                    href="https://www.youtube.com/@nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="link-left">

                        <img
                            src="icons/youtube.png"
                            alt="YouTube"
                        >

                        <span>
                            YouTube
                        </span>

                    </div>

                    <span class="arrow">
                        ↗
                    </span>

                </a>


                <!-- GITHUB -->
                <a
                    href="https://github.com/nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="link-left">

                        <img
                            src="icons/github.png"
                            alt="GitHub"
                        >

                        <span>
                            GitHub
                        </span>

                    </div>

                    <span class="arrow">
                        ↗
                    </span>

                </a>

            </div>


            <!-- PROFILE WIDGETS -->
            <div class="widgets">

                <div class="widget">

                    <div class="widget-icon">
                        ●
                    </div>

                    <div class="widget-text">

                        <strong>
                            currently
                        </strong>

                        <span>
                            doing stuff
                        </span>

                    </div>

                    <div class="online-dot"></div>

                </div>


                <div class="widget">

                    <div class="widget-icon">
                        #
                    </div>

                    <div class="widget-text">

                        <strong>
                            McPvP.com
                        </strong>

                        <span>
                            #21
                        </span>

                    </div>

                </div>

            </div>


            <!-- PLAYER -->
            <div class="player">

                <button
                    id="music-toggle"
                    type="button"
                    aria-label="Pause video"
                >
                    ❚❚
                </button>


                <div class="track">

                    <strong>
                        now playing
                    </strong>

                    <span>
                        background video
                    </span>

                </div>

            </div>

        </div>


        <footer>
            nxrdonut · 2026
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
