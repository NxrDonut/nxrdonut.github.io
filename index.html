<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title">nxrdonut</title>

    <meta
        name="description"
        content="Screensharer / Dev / #21 McPvP.com / RLT2"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BACKGROUND VIDEO
         ========================= -->

    <video
        id="background-video"
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="video.mp4" type="video/mp4">
    </video>


    <!-- =========================
         BACKGROUND EFFECTS
         ========================= -->

    <div class="background-gradient"></div>

    <div class="darkness"></div>

    <div class="noise"></div>

    <div class="cursor-glow"></div>


    <!-- =========================
         CLICK SCREEN
         ========================= -->

    <div id="intro">

        <button id="enter">
            CLICK
        </button>

    </div>


    <!-- =========================
         MAIN PROFILE
         ========================= -->

    <main id="profile">

        <div
            class="card"
            id="profile-card"
        >


            <!-- =========================
                 PROFILE PICTURE
                 ========================= -->

            <div class="avatar-container">

                <img
                    class="avatar"
                    src="pfp.jpg"
                    alt="nxrdonut"
                >

                <div class="avatar-glow"></div>

            </div>


            <!-- =========================
                 USERNAME
                 ========================= -->

            <h1 class="username">

                <span>nxrdonut</span>

                <span class="verified">
                    ✓
                </span>

            </h1>


            <p class="handle">
                @nxrdonut
            </p>


            <!-- =========================
                 BADGES
                 ========================= -->

            <div class="badges">

                <span
                    class="badge"
                    title="Developer"
                >
                    DEV
                </span>

                <span
                    class="badge"
                    title="Screensharer"
                >
                    SCREENSHARER
                </span>

                <span
                    class="badge"
                    title="McPvP"
                >
                    #21
                </span>

                <span
                    class="badge"
                    title="RLT2"
                >
                    RLT2
                </span>

            </div>


            <!-- =========================
                 BIO
                 ========================= -->

            <p class="bio">
                Screensharer / Dev / #21 McPvP.com / RLT2
            </p>


            <!-- =========================
                 STATS
                 ========================= -->

            <div class="stats">

                <button
                    id="views-button"
                    class="stat"
                >

                    <span class="stat-icon">
                        ◉
                    </span>

                    <span>

                        <strong id="views">
                            0
                        </strong>

                        <small>
                            views
                        </small>

                    </span>

                </button>


                <div class="stat">

                    <span class="stat-icon">
                        ●
                    </span>

                    <span>

                        <strong>
                            online
                        </strong>

                        <small>
                            status
                        </small>

                    </span>

                </div>

            </div>


            <!-- =========================
                 VIEWS POPUP
                 ========================= -->

            <div
                id="views-popup"
                class="views-popup"
            >

                <div class="views-popup-inner">

                    <span class="popup-icon">
                        ◉
                    </span>

                    <strong>
                        Profile views
                    </strong>

                    <span id="popup-views">
                        0
                    </span>

                </div>

            </div>


            <div class="divider"></div>


            <!-- =========================
                 SOCIAL LINKS
                 ========================= -->

            <div class="links">


                <!-- DISCORD -->

                <a
                    href="#"
                    onclick="copyDiscord(event)"
                >

                    <div class="link-left">

                        <img
                            src="icons/discord.png"
                            alt="Discord"
                        >

                        <span id="discord-text">
                            Discord
                        </span>

                    </div>

                    <span class="arrow">
                        ↗
                    </span>

                </a>


                <!-- YOUTUBE -->

                <a
                    href="https://www.youtube.com/@nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="link-left">

                        <img
                            src="icons/youtube.png"
                            alt="YouTube"
                        >

                        <span>
                            YouTube
                        </span>

                    </div>

                    <span class="arrow">
                        ↗
                    </span>

                </a>


                <!-- GITHUB -->

                <a
                    href="https://github.com/nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="link-left">

                        <img
                            src="icons/github.png"
                            alt="GitHub"
                        >

                        <span>
                            GitHub
                        </span>

                    </div>

                    <span class="arrow">
                        ↗
                    </span>

                </a>

            </div>


            <!-- =========================
                 WIDGETS
                 ========================= -->

            <div class="widgets">


                <!-- STATUS -->

                <div class="widget">

                    <div class="widget-icon">
                        ●
                    </div>

                    <div class="widget-text">

                        <strong>
                            currently
                        </strong>

                        <span>
                            doing stuff
                        </span>

                    </div>

                    <div class="online-dot"></div>

                </div>


                <!-- LOCATION -->

                <div class="widget">

                    <div class="widget-icon">
                        #
                    </div>

                    <div class="widget-text">

                        <strong>
                            McPvP.com
                        </strong>

                        <span>
                            #21
                        </span>

                    </div>

                </div>

            </div>


            <!-- =========================
                 PLAYER
                 ========================= -->

            <div class="player">


                <button
                    id="music-toggle"
                    aria-label="Pause video"
                >
                    ❚❚
                </button>


                <div class="track">

                    <strong>
                        now playing
                    </strong>

                    <span>
                        background video
                    </span>

                </div>


                <div class="volume">

                    <span>
                        🔊
                    </span>

                    <input
                        id="volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                    >

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <footer>

            <span>
                nxrdonut
            </span>

            <span>
                ·
            </span>

            <span>
                2026
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
```
