<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>nxrdonut</title>
    <meta name="description" content="nxrdonut's personal website">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background video -->
    <video id="background-video" muted loop playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <!-- Dark overlay -->
    <div class="darkness"></div>

    <!-- Subtle screen effect -->
    <div class="noise"></div>

    <!-- CLICK INTRO -->
    <div id="intro">
        <button id="enter" aria-label="Enter website">
            CLICK
        </button>
    </div>

    <!-- Background music -->
    <audio id="music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN PROFILE -->
    <main id="profile">

        <div class="card">

            <!-- Avatar -->
            <div class="avatar">
                n
            </div>

            <!-- Name -->
            <h1>nxrdonut</h1>

            <p class="handle">@nxrdonut</p>

            <!-- Bio -->
            <p class="bio">
                just some person on the internet.
            </p>

            <div class="divider"></div>

            <!-- Links -->
            <div class="links">

                <a
                    href="https://github.com/nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span>GitHub</span>
                    <span>↗</span>
                </a>

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span>Discord</span>
                    <span>↗</span>
                </a>

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span>Something else</span>
                    <span>↗</span>
                </a>

            </div>

            <!-- MUSIC PLAYER -->
            <div class="player">

                <button id="music-toggle" aria-label="Pause music">
                    ❚❚
                </button>

                <div class="track">
                    <strong>now playing</strong>
                    <span>your music</span>
                </div>

                <div class="volume">
                    <input
                        id="volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                        aria-label="Volume"
                    >
                </div>

            </div>

        </div>

        <footer>
            nxrdonut · 2026
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
