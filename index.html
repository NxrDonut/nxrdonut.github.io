```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>nxrdonut</title>
    <meta
        name="description"
        content="nxrdonut - Screensharer / Dev / #21 McPvP.com / RLT2"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BACKGROUND VIDEO
         ========================= -->

    <video
        id="background-video"
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="video.mp4" type="video/mp4">
    </video>


    <!-- DARK OVERLAY -->

    <div class="darkness"></div>


    <!-- SCREEN NOISE -->

    <div class="noise"></div>


    <!-- =========================
         CLICK SCREEN
         ========================= -->

    <div id="intro">

        <button
            id="enter"
            aria-label="Enter website"
        >
            CLICK
        </button>

    </div>


    <!-- =========================
         PROFILE
         ========================= -->

    <main id="profile">

        <div class="card">


            <!-- PROFILE PICTURE -->

            <img
                class="avatar"
                src="pfp.jpg"
                alt="nxrdonut"
            >


            <!-- NAME -->

            <h1>
                nxrdonut
            </h1>


            <!-- USERNAME -->

            <p class="handle">
                @nxrdonut
            </p>


            <!-- BIO -->

            <p class="bio">
                Screensharer / Dev / #21 McPvP.com / RLT2
            </p>


            <!-- DIVIDER -->

            <div class="divider"></div>


            <!-- =========================
                 LINKS
                 ========================= -->

            <div class="links">


                <!-- GITHUB -->

                <a
                    href="https://github.com/nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span>
                        GitHub
                    </span>

                    <span>
                        ↗
                    </span>
                </a>


                <!-- DISCORD -->

                <a
                    href="#"
                    onclick="copyDiscord(event)"
                >
                    <span id="discord-text">
                        Discord
                    </span>

                    <span>
                        ↗
                    </span>
                </a>


                <!-- YOUTUBE -->

                <a
                    href="https://www.youtube.com/@nxrdonut"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span>
                        YouTube
                    </span>

                    <span>
                        ↗
                    </span>
                </a>

            </div>


            <!-- =========================
                 VIDEO PLAYER
                 ========================= -->

            <div class="player">


                <!-- PLAY / PAUSE -->

                <button
                    id="music-toggle"
                    aria-label="Pause video"
                >
                    ❚❚
                </button>


                <!-- TRACK -->

                <div class="track">

                    <strong>
                        now playing
                    </strong>

                    <span>
                        background video
                    </span>

                </div>


                <!-- VOLUME -->

                <div class="volume">

                    <input
                        id="volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                        aria-label="Volume"
                    >

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <footer>
            nxrdonut · 2026
        </footer>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
```
